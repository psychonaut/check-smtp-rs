[package]
name = "check-smtp"
version = "0.1.0"
edition = "2024"
description = "Nagios-compatible SMTP check with STARTTLS, SMTPS and PROXY protocol support"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
time = { version = "0.3.55", features = ["formatting"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
time = { version = "0.3.55", features = ["macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
